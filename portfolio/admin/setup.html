<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração Inicial - Portfolio Wiki</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-container {
      max-width: 480px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Primeiro Acesso — Administrador</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
      Nenhum usuário administrativo configurado. Defina as credenciais do primeiro administrador do Portfolio.
    </p>

    <div id="alert-box" style="display: none;" class="alert"></div>

    <form id="setup-form">
      <div class="form-group">
        <label for="username">Nome de Usuário</label>
        <input type="text" id="username" class="form-control" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="email">E-mail Corporativo</label>
        <input type="email" id="email" class="form-control" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Senha de Acesso (Mínimo 8 caracteres)</label>
        <input type="password" id="password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar Senha</label>
        <input type="password" id="confirm-password" class="form-control" required minlength="8" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Criar Conta de Administrador</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('setup-form');
    const alertBox = document.getElementById('alert-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alertBox.className = 'alert notice-danger';
        alertBox.textContent = 'As senhas informadas não coincidem.';
        alertBox.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Erro ao realizar setup inicial.');
        }

        alertBox.className = 'alert notice';
        alertBox.textContent = 'Conta criada com sucesso! Redirecionando para login...';
        alertBox.style.display = 'block';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        alertBox.className = 'alert notice-danger';
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
