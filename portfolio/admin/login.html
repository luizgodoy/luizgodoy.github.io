<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo - Portfolio Wiki</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .auth-container {
      max-width: 440px;
      margin: 5rem auto;
      padding: 2.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-primary);
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Acesso Administrativo</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
      Autentique-se para gerenciar o catálogo de produtos e sistemas.
    </p>

    <div id="alert-box" style="display: none;" class="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="identifier">Usuário ou E-mail</label>
        <input type="text" id="identifier" class="form-control" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="form-control" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar no Painel</button>
    </form>
    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="../index.html" style="font-size: 0.9rem;">&larr; Voltar para a Área Pública</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');

    // Check if setup is needed
    fetch('/api/auth/status')
      .then(res => res.json())
      .then(data => {
        if (data.setupRequired) {
          window.location.href = 'setup.html';
        } else if (data.authenticated) {
          window.location.href = 'index.html';
        }
      })
      .catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Credenciais inválidas.');
        }

        window.location.href = 'index.html';
      } catch (err) {
        alertBox.className = 'alert notice-danger';
        alertBox.textContent = err.message;
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
